<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanukkah Gift List</title>
  <meta name="description" content="Hanukkah gift ideas and wish list.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="candles" aria-hidden="true">🕎</div>
    <h1>Hanukkah Gift List</h1>
    <p class="sub">Happy Hanukkah! A little wish list for the family.</p>
  </header>

  <main>
    <section class="controls" aria-label="Filter and sort">
      <input id="search" type="search" placeholder="Search gifts…" aria-label="Search gifts">
      <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
      <select id="sort" aria-label="Sort">
        <option value="default">Sort: Favorites first</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </select>
    </section>

    <p id="count" class="count" aria-live="polite"></p>
    <section id="grid" class="grid"></section>
    <p id="empty" class="empty" hidden>No gifts match your search.</p>
  </main>

  <footer>Happy Hanukkah · Prices and availability may change</footer>
  <script src="app.js"></script>
</body>
</html>
